# render.yaml — Render Blueprint
# Render automatically detects this file and configures the service.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: seo-tracker-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    region: singapore
    plan: free

    # Environment variables — fill these in Render dashboard
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # Secret — set manually in Render dashboard
      - key: JWT_SECRET
        sync: false          # Secret — set manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false          # Secret — set manually in Render dashboard
      - key: BROWSERBASE_API_KEY
        sync: false          # Secret — set manually in Render dashboard
      - key: GOOGLE_SEARCH_COUNTRY
        value: in
      - key: GOOGLE_SEARCH_LANGUAGE
        value: en
      - key: CLIENT_URL
        sync: false          # Set to your Vercel URL after frontend deploy
