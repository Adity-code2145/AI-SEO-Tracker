# Docker Compose — local full-stack development
# Usage:  docker compose up --build
#
# Frontend → http://localhost:3000
# Backend  → http://localhost:5000

version: "3.9"

services:
  # ── Backend (Node / Express) ──────────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: seo_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      BROWSERBASE_API_KEY: ${BROWSERBASE_API_KEY}
      GOOGLE_SEARCH_COUNTRY: ${GOOGLE_SEARCH_COUNTRY:-in}
      GOOGLE_SEARCH_LANGUAGE: ${GOOGLE_SEARCH_LANGUAGE:-en}
      CLIENT_URL: http://localhost:3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (React → Nginx) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:5000
    container_name: seo_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
